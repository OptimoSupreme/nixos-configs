#### Weekly flake.lock bump ####

name: update-flake-lock

on:
  schedule:
    - cron: "0 4 * * 0" # weekly, Sunday 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v23

      - name: Update flake inputs
        run: nix flake update

      - uses: ./.github/actions/check

      - name: Commit and push if changed
        id: push
        run: |
          if git diff --quiet flake.lock; then
            echo "flake.lock already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(flake): weekly lock update" flake.lock
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN pushes do not trigger on: push, so start the cache builds by hand
      - name: Build the Steam hosts into the cache
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run cache-gollum.yml --ref main
          gh workflow run cache-smeagol.yml --ref main
