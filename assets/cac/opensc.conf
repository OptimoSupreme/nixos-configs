app default {
	reader_driver pcsc {
		enable_pinpad = false;
	}

	# G&D FIPS 201 SCE 7.0 CAC: force the PIV driver by ATR. Without this,
	# OpenSC's card-type probing sends GET DATA DF30 on connect; if a previous
	# session left the PIV applet selected, the applet hangs on that APDU and
	# the card goes mute until a cold power cycle (seen as "Card absent or
	# mute" floods in the pcscd journal). Fixes intermittent CAC failures on
	# generic readers such as the Alcor AK9563 (2ce3:9563).
	card_atr 3b:d8:18:00:80:1f:07:80:31:c1:64:08:06:92:0f:df {
		driver = "PIV-II";
	}
}
app pkcs15-init {
	framework pkcs15 {
		use_file_caching = false;
	}
}
