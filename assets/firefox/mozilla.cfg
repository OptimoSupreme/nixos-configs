// Firefox defaults — all settings use defaultPref() so users can override.
// (First line of mozilla.cfg is always treated as a comment by Firefox.)

// --- Media ---
defaultPref("media.eme.enabled", true);

// --- Link previews (ML-powered hover cards) ---
defaultPref("browser.ml.linkPreview.enabled", false);

// --- "Recommend extensions/features as you browse" ---
defaultPref("browser.discovery.enabled", false);
defaultPref("browser.newtabpage.activity-stream.asrouter.userprefs.cfr.addons", false);
defaultPref("browser.newtabpage.activity-stream.asrouter.userprefs.cfr.features", false);

// --- Home / new tab → Firefox Home ---
defaultPref("browser.startup.page", 1);
defaultPref("browser.startup.homepage", "about:home");
defaultPref("browser.newtabpage.enabled", true);

// Firefox Home tiles
defaultPref("browser.newtabpage.activity-stream.showWeather", false);
defaultPref("browser.newtabpage.activity-stream.feeds.topsites", false);
defaultPref("browser.newtabpage.activity-stream.feeds.section.topstories", false);
defaultPref("browser.newtabpage.activity-stream.feeds.system.topstories", false);
defaultPref("browser.newtabpage.activity-stream.showSponsored", false);
defaultPref("browser.newtabpage.activity-stream.showSponsoredTopSites", false);
// "Support Firefox" master toggle (hides the section + unchecks sponsored
// checkboxes). Verified via Mozilla source: AboutPreferences.sys.mjs maps
// the home-prefs-support-firefox-header l10n id to this pref.
defaultPref("browser.newtabpage.activity-stream.showSponsoredCheckboxes", false);

// New "Nova"-style weather widget pref (in addition to legacy showWeather)
defaultPref("browser.newtabpage.activity-stream.widgets.weather.enabled", false);

// --- URL bar suggestions ---
// Keep search suggestions on; kill trending
defaultPref("browser.search.suggest.enabled", true);
defaultPref("browser.urlbar.suggest.searches", true);
defaultPref("browser.urlbar.trending.featureGate", false);
defaultPref("browser.urlbar.suggest.trending", false);

// "Suggest search engines to use"
defaultPref("browser.urlbar.suggest.engines", false);

// Quick actions
defaultPref("browser.urlbar.quickactions.enabled", false);
defaultPref("browser.urlbar.suggest.quickactions", false);
defaultPref("browser.urlbar.shortcuts.quickactions", false);

// Firefox Suggest master + sub-toggles are locked via the FirefoxSuggest
// enterprise policy in modules/firefox.nix. Locking is required because Mozilla's
// Nimbus experiment system writes user-branch values that override defaultPref.
defaultPref("browser.urlbar.quicksuggest.enabled", false);
defaultPref("browser.urlbar.suggest.quicksuggest.nonsponsored", false);
defaultPref("browser.urlbar.suggest.quicksuggest.sponsored", false);

// --- Permissions: block new requests by default ---
defaultPref("permissions.default.geo", 2);
defaultPref("permissions.default.desktop-notification", 2);

// --- Telemetry / data submission ---
defaultPref("datareporting.healthreport.uploadEnabled", false);
defaultPref("datareporting.policy.dataSubmissionEnabled", false);
defaultPref("toolkit.telemetry.enabled", false);
defaultPref("toolkit.telemetry.unified", false);
defaultPref("toolkit.telemetry.archive.enabled", false);

// --- AI / chatbot enhancements ---
// "Block AI enhancements" master. Verified via Mozilla source:
// aiFeatures.mjs maps preferences-ai-controls-block-ai to this string pref.
// "blocked" disables ALL AI features (translations, alt-text, smart tabs,
// link previews, chatbot, smart window) unless individually overridden.
defaultPref("browser.ai.control.default", "blocked");

// Per-feature AI controls (each inherits the master when set to "default";
// pinning them all to "blocked" is belt-and-suspenders).
defaultPref("browser.ai.control.translations", "blocked");
defaultPref("browser.ai.control.pdfjsAltText", "blocked");
defaultPref("browser.ai.control.smartTabGroups", "blocked");
defaultPref("browser.ai.control.linkPreviewKeyPoints", "blocked");
defaultPref("browser.ai.control.sidebarChatbot", "blocked");
defaultPref("browser.ai.control.smartWindow", "blocked");

// Feature-level AI prefs that control whether the feature is shown at all
// (browser.ai.control.* above governs whether AI is "blocked" within
// features that ARE shown — these prefs hide the features themselves).
defaultPref("browser.ml.chat.enabled", false);
defaultPref("browser.ml.chat.shortcuts", false);
defaultPref("browser.ml.chat.sidebar", false);
defaultPref("browser.ml.chat.menu", false);
defaultPref("browser.tabs.groups.smart.userEnabled", false);
defaultPref("pdfjs.enableAltText", false);
defaultPref("pdfjs.enableAltTextModelDownload", false);

// --- VPN promo suppression ---
defaultPref("browser.vpn_promo.enabled", false);
defaultPref("browser.privatebrowsing.vpnpromourl", "");

// --- Sidebar ---
// sidebar.revamp + sidebar.verticalTabs are locked via the Preferences policy
// in modules/firefox.nix. defaultPref isn't enough — Nimbus rollouts flip
// sidebar.revamp to user-branch true seconds after startup, which makes
// SidebarController inject the sidebar-button widget into nav-bar regardless
// of browser.uiCustomization.state. If you'd rather keep the new sidebar and
// just hide the button, unlock revamp and add a userChrome.css rule.

// --- First-run / "What's New" / import-from-other-browser flow ---
defaultPref("browser.aboutwelcome.enabled", false);
defaultPref("startup.homepage_welcome_url", "");
defaultPref("startup.homepage_welcome_url.additional", "");
defaultPref("browser.startup.homepage_override.mstone", "ignore");
defaultPref("datareporting.policy.firstRunURL", "");

// --- Toolbar layout ---
// Removes: sidebar-button, alltabs-button, firefox-view-button,
//          customizableui-special-spring1/2, import-button.
// Extensions are pinned to the unified-extensions popup, not the toolbar.
// currentVersion is set high to suppress Firefox's widget-migration code,
// which would otherwise re-add new default widgets (sidebar-button, import-
// button, etc.) when the browser updates. Lower it if you want to opt into
// future default widgets.
// NOTE: defaultPref only seeds NEW profiles. Existing profiles keep their
// own browser.uiCustomization.state user pref and won't pick up changes.
defaultPref("browser.uiCustomization.state", '{"placements":{"widget-overflow-fixed-list":[],"unified-extensions-area":["ublock0_raymondhill_net-browser-action","sponsorblocker_ajay_app-browser-action"],"nav-bar":["back-button","forward-button","stop-reload-button","urlbar-container","save-to-pocket-button","downloads-button","fxa-toolbar-menu-button","unified-extensions-button"],"toolbar-menubar":["menubar-items"],"TabsToolbar":["tabbrowser-tabs","new-tab-button"],"PersonalToolbar":["personal-bookmarks"]},"currentVersion":100,"newElementCount":0}');
